name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@337b3f3bad4aaea1fd76d3e5fd16ed7899ae88ec
    with:
      buildchain-ref: 337b3f3bad4aaea1fd76d3e5fd16ed7899ae88ec
      require-version-state: true
      upload-artifacts: true
