name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@1b071346efbae3886ec463298d50e02ede31f600
    with:
      buildchain-ref: 1b071346efbae3886ec463298d50e02ede31f600
      require-version-state: true
      upload-artifacts: true
