      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@9e775fa1f698d857f8325c9c89777ea07ee98294
    with:
      buildchain-ref: 9e775fa1f698d857f8325c9c89777ea07ee98294
      require-version-state: true
      upload-artifacts: true
