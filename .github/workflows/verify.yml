name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@97ecea8df0b8593c63fcf57f3f277ebb7081f017
    with:
      buildchain-ref: 97ecea8df0b8593c63fcf57f3f277ebb7081f017
      require-version-state: true
      upload-artifacts: true
