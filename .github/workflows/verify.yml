name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@bd588c402f7b601a8bcd7c9ec97d4a5cb2942103
    with:
      buildchain-ref: bd588c402f7b601a8bcd7c9ec97d4a5cb2942103
      require-version-state: true
      upload-artifacts: true
