name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@0395e290736c49c38982fc85d916d09ba07a5f16
    with:
      buildchain-ref: 0395e290736c49c38982fc85d916d09ba07a5f16
      require-version-state: true
      upload-artifacts: true
