name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@72add9cc62566c1c1cbf3b1f01d2d4d2f74a2826
    with:
      buildchain-ref: 72add9cc62566c1c1cbf3b1f01d2d4d2f74a2826
      require-version-state: true
      upload-artifacts: true
