name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@c79b12aa311d9d39ff9c42164bf1b450df2e6e9b
    with:
      buildchain-ref: c79b12aa311d9d39ff9c42164bf1b450df2e6e9b
      require-version-state: true
      upload-artifacts: true
