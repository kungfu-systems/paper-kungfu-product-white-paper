name: Verify

on:
  pull_request:
  push:
    branches:
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/v*/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: kungfu-systems/buildchain/.github/workflows/check.yml@2d0688f6efa343abf7de827d5c6a057f28ce9d71
    with:
      buildchain-ref: 2d0688f6efa343abf7de827d5c6a057f28ce9d71
      require-version-state: true
      upload-artifacts: true
