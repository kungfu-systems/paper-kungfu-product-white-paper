name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "dev/**"
      - "alpha/**"
      - "release/**"

permissions:
  contents: read
  issues: write

jobs:
  publication:
    uses: kungfu-systems/buildchain/.github/workflows/publication-artifact.yml@2d0688f6efa343abf7de827d5c6a057f28ce9d71
    with:
      buildchain-ref: 2d0688f6efa343abf7de827d5c6a057f28ce9d71
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      toolchain-type: config
      verify-command: make check
      artifact-name: "paper-kungfu-product-white-paper"
