# Next-development contract: kungfu-buildchain-next-development-transition/v1
# Durable controller: kungfu-buildchain-next-development-controller/v1
# A completed Alpha remains successful and its refs remain immutable while the next-development transition is incomplete.
name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "dev/**"
      - "alpha/**"
      - "release/**"

permissions:
  contents: read
  issues: write

jobs:
  publication:
    uses: kungfu-systems/buildchain/.github/workflows/publication-artifact.yml@v4-alpha
    with:
      buildchain-ref: v4-alpha
      buildchain-contract-lock-path: .buildchain/alpha-contract-lock.json
      toolchain-type: config
      verify-command: make check
      artifact-name: "paper-kungfu-product-white-paper"
