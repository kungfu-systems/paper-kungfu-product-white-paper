name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "dev/**"
      - "alpha/**"
      - "release/**"

permissions:
  contents: read
  issues: write

jobs:
  publication:
    uses: kungfu-systems/buildchain/.github/workflows/publication-artifact.yml@337b3f3bad4aaea1fd76d3e5fd16ed7899ae88ec
    with:
      buildchain-ref: 337b3f3bad4aaea1fd76d3e5fd16ed7899ae88ec
      buildchain-contract-lock-path: .buildchain/contract-lock.json
      toolchain-type: config
      verify-command: make check
      artifact-name: "paper-kungfu-product-white-paper"
